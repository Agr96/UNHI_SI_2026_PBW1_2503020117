<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Kalkulator Pertemuan 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="calculator-card p-4">
        <h4 class="text-center mb-4">Calculator</h4>
        <h6 class="text-center mb-3">I WAYAN ANDRE</h1>
        
        <!-- Frame Display -->
        <div id="display">0</div>
        <div class="row g-2">
            <div class="col-3"><button class="btn btn-calc w-100" onclick="clearDisplay()">C</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="deleteLast()">DEL</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('%')">%</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('/')">/</button></div>

            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('7')">7</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('8')">8</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('9')">9</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('*')">*</button></div>

            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('4')">4</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('5')">5</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('6')">6</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('-')">-</button></div>

            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('1')">1</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('2')">2</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('3')">3</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('+')">+</button></div>

            <div class="col-6"><button class="btn btn-calc w-100" onclick="appendToDisplay('0')">0</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" onclick="appendToDisplay('.')">.</button></div>
            <div class="col-3"><button class="btn btn-calc w-100" id="btn-calculate" onclick="calculate()">=</button></div>
        </div>

        <div id="history-section" style="display: block; border-top: 1px solid #333; margin-top: 20px; padding-top: 10px;">
            <h6>Log History</h6>
            <div id="history-list"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
